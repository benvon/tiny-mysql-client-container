name: Release and Publish

on:
  push:
    tags:
      - 'v*.*.*'  # Matches semver tags
    branches:
      - main
      - develop

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          body: |
            Changes in this Release:
            ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish Docker Image
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set version from tag
        id: version
        run: |
          if [[ ${{ github.ref }} =~ refs/tags/v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            echo "VERSION=${BASH_REMATCH[1]}" >> $GITHUB_ENV
          else
            echo "VERSION=latest" >> $GITHUB_ENV
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.VERSION }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.title=Tiny MySQL Client
            org.opencontainers.image.description=A minimal MySQL client container
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.architectures=amd64,arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # - name: Verify published images
      #   run: |
      #     # Test both architectures
      #     for arch in amd64 arm64; do
      #       echo "Verifying $arch architecture..."
      #       docker pull --platform linux/$arch ghcr.io/${{ github.repository }}:${{ env.VERSION }}
      #       docker run --rm --platform linux/$arch ghcr.io/${{ github.repository }}:${{ env.VERSION }} --version
      #       docker run --rm --platform linux/$arch ghcr.io/${{ github.repository }}:${{ env.VERSION }} -h
      #     done
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  branch-release:
    name: Branch Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract branch name
        id: branch
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "BRANCH=${BRANCH_NAME}" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.BRANCH }}
          labels: |
            org.opencontainers.image.title=Tiny MySQL Client
            org.opencontainers.image.description=A minimal MySQL client container
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ env.BRANCH }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.architectures=amd64,arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # - name: Verify published images
      #   run: |
      #     # Test both architectures
      #     for arch in amd64 arm64; do
      #       echo "Verifying $arch architecture..."
      #       docker pull --platform linux/$arch ghcr.io/${{ github.repository }}:${{ env.BRANCH }}
      #       docker run --rm --platform linux/$arch ghcr.io/${{ github.repository }}:${{ env.BRANCH }} --version
      #       docker run --rm --platform linux/$arch ghcr.io/${{ github.repository }}:${{ env.BRANCH }} -h
      #     done 